openapi: 3.0.2
info:
  title: World Cube Association API
  description: |-
    Welcome to the unofficial World Cube Association (WCA) Public API documentation! Here, you'll find all the information you need to integrate our API seamlessly into your projects. Access competition data, results, competitor profiles, rankings, and more.

    **Note:** This API is served through static json files on *GitHub*, that means the structure of the endpoints have limitations. The reason for doing so is:
    
    * The data doesn't change that much, max once a day
    * Static file based API is very fast
    * I don't want to pay for any hosting because it would get very expensive, very fast
  contact:
    email: ingelbrecht_robin@hotmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: The source code of the API
  url: https://github.com/robiningelbrecht/wca-rest-api
servers:
  - url: https://raw.githubusercontent.com/robiningelbrecht/wca-rest-api/master
tags:
  - name: general
    description: Some general/generic endpoints
  - name: competition
    description: Competition related API calls
  - name: person
    description: Person related API calls
  - name: rank
    description: Rank related API calls
  - name: result
    description: Result related API calls
paths:
  /api/continents.json:
    get:
      tags:
        - general
      summary: Fetch all continents
      description: Fetch all continents
      operationId: getContinents
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Continent'
  /api/countries.json:
    get:
      tags:
        - general
      summary: Fetch all countries
      description: Fetch all countries
      operationId: getCountries
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
  /api/events.json:
    get:
      tags:
        - general
      summary: Fetch all event types
      description: Fetch all event types
      operationId: getEvents
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /api/competitions{-page-[0-9]}.json:
    get:
      tags:
        - competition
      summary: Fetch all competitions
      description: Fetch all competitions
      operationId: getCompetitions
      parameters:
        - name: -page-[0-9]
          in: path
          description: Page that needs to be fetched
          required: true
          schema:
            type: string
            example: '-page-1'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competitions'
  /api/competitions/{country}.json:
    get:
      tags:
        - competition
      summary: Fetch all competitions for a given country
      description: Fetch all competitions for a given country
      operationId: getCompetitionsByCountry
      parameters:
        - name: country
          in: path
          description: The country to filter the competitions on. For a list of valid countries, check `/api/countries.json`
          required: true
          schema:
            type: string
            example: BE
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competitions'
  /api/competitions/{year}.json:
    get:
      tags:
        - competition
      summary: Fetch all competitions for a given year
      description: Fetch all competitions for a given year
      operationId: getCompetitionsByYear
      parameters:
        - name: year
          in: path
          description: The year to filter the competitions on.
          required: true
          schema:
            type: integer
            example: '2023'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competitions'
  /api/competitions/{event}{-page-[0-9]}.json:
    get:
      tags:
        - competition
      summary: Fetch all competitions for a given event
      description: Fetch all competitions  for a given event
      operationId: getCompetitionsByEvent
      parameters:
        - name: event
          in: path
          description: The event to filter the competitions on. For a list of valid events, check `/api/events.json`
          required: true
          schema:
            type: string
            example: '333'
        - name: -page-[0-9]
          in: path
          description: Page that needs to be fetched
          required: true
          schema:
            type: string
            example: '-page-1'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competitions'
  /api/competitions/{id}.json:
    get:
      tags:
        - competition
      summary: Fetch a competition by a given id
      description: Fetch a competition by a given id
      operationId: getCompetitionById
      parameters:
        - name: id
          in: path
          description: Id of the competition to fetch
          required: true
          schema:
            type: string
            example: BrizZonSylwesterOpen2023
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competition'
  /api/persons{-page-[0-9]}.json:
    get:
      tags:
        - person
      summary: Fetch all persons
      description: Fetch all persons
      operationId: getPersons
      parameters:
        - name: -page-[0-9]
          in: path
          description: Page that needs to be fetched
          required: true
          schema:
            type: string
            example: '-page-1'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persons'
  /api/persons/{id}.json:
    get:
      tags:
        - person
      summary: Fetch a person by a given id
      description: Fetch a person by a given id
      operationId: getPersonById
      parameters:
        - name: id
          in: path
          description: Id of the person to fetch
          required: true
          schema:
            type: string
            example: 2005AUST01
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
  /api/persons/{name}.json:
    get:
      tags:
        - person
      summary: Fetch a person by a given name
      description: Fetch a person by a given name
      operationId: getPersonByName
      parameters:
        - name: name
          in: path
          description: Name (slug) of the person to fetch
          required: true
          schema:
            type: string
            example: john-doe
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
  /api/rank/{region}/{type}/{event}.json:
    get:
      tags:
        - rank
      summary: Fetch the ranking for a given region, type and event
      description: Fetch the ranking for a given region, type and event (first 1000 places)
      operationId: getRank
      parameters:
        - name: region
          in: path
          description: The region to filter the rankings on. Can be "world" or one of the ids in `api/continents.json` or `api/countries.json`
          required: true
          schema:
            type: string
            example: 'world'
        - name: type
          in: path
          description: The type to filter the rankings on
          required: true
          schema:
            type: string
            example: 'single'
            enum:
              - single
              - average
        - name: event
          in: path
          description: The event to filter the rankings on. For a list of valid events, check `/api/events.json`
          required: true
          schema:
            type: string
            example: '333'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ranks'
  /api/result/{competition}.json:
    get:
      tags:
        - result
      summary: Fetch the results for a given competition
      description: Fetch the results for a given competition
      operationId: getResultsByCompetition
      parameters:
        - name: competition
          in: path
          description: The competition to filter the results on
          required: true
          schema:
            type: string
            example: 'BrizZonSylwesterOpen2023'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Results'
  /api/result/{competition}/{event}.json:
    get:
      tags:
        - result
      summary: Fetch the results for a given competition
      description: Fetch the results for a given competition
      operationId: getResultsByCompetition
      parameters:
        - name: competition
          in: path
          description: The competition to filter the results on
          required: true
          schema:
            type: string
            example: 'BrizZonSylwesterOpen2023'
        - name: event
          in: path
          description: The event to filter the results on
          required: true
          schema:
            type: string
            example: '333'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Results'
components:
  schemas:
    Continent:
      type: object
      properties:
        id:
          type: string
          example: europe
        name:
          type: string
          example: Europe
    Country:
      type: object
      properties:
        iso2Code:
          type: string
          example: BE
        name:
          type: string
          example: Belgium
    Event:
      type: object
      properties:
        id:
          type: string
          example: '333'
        name:
          type: string
          example: 3x3x3 Cube
        format:
          type: string
          example: time
          enum:
            - time
            - number
            - multi
    Competition:
      type: object
      properties:
        id:
          type: string
          example: BrizZonSylwesterOpen2023
        name:
          type: string
          example: BrizZon Sylwester Open 2023
        city:
          type: string
          example: Poznań
        country:
          type: string
          example: PL
        date:
          type: object
          properties:
            from:
              type: string
              format: date
            till:
              type: string
              format: date
            numberOfDays:
              type: integer
              format: int64
              example: 1
        isCanceled:
          type: boolean
          example: false
        events:
          type: array
          items:
            type: string
            example: '333'
        wcaDelegates:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: John Doe
              email:
                type: string
                example: john-doe@worldcubeassociation.org
        organisers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: John Doe
              email:
                type: string
                example: john-doe@worldcubeassociation.org
        venue:
          type: object
          properties:
            name:
              type: string
              example: Klub BrizZon
            address:
              type: string
              example: ul. Karpia 10, 61-619 Poznań
            details:
              type: string
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                  example: 52.444748
                longitude:
                  type: number
                  example: 16.948881
        information:
          type: string
        externalWebsite:
          type: string
    Person:
      type: object
      properties:
        id:
          type: string
          example: 2005AUST01
        name:
          type: string
          example: John Doe
        slug:
          type: string
          example: john-doe
        country:
          type: string
          example: US
        numberOfCompetitions:
          type: integer
          format: int64
          example: 1
        competitionIds:
          type: array
          items:
            type: string
            example: CaltechDallas2005
        rank:
          type: object
          properties:
            singles:
              type: array
              items:
                type: object
                properties:
                  eventId:
                    type: string
                    example: '333'
                  best:
                    type: integer
                    format: int64
                    example: 7158
                  rank:
                    type: object
                    properties:
                      world:
                        type: integer
                        format: int64
                        example: 179062
                      continent:
                        type: integer
                        format: int64
                        example: 46433
                      country:
                        type: integer
                        format: int64
                        example: 35643
            averages:
              type: array
              items:
                type: object
                properties:
                  eventId:
                    type: string
                    example: '333'
                  best:
                    type: integer
                    format: int64
                    example: 8078
                  rank:
                    type: object
                    properties:
                      world:
                        type: integer
                        format: int64
                        example: 173100
                      continent:
                        type: integer
                        format: int64
                        example: 46433
                      country:
                        type: integer
                        format: int64
                        example: 35643
        results:
          type: object
          properties:
            CaltechDallas2005:
              type: object
              properties:
                '333':
                  type: array
                  items:
                    type: object
                    properties:
                      round:
                        type: string
                        example: First round
                      position:
                        type: integer
                        format: int64
                        example: 26
                      best:
                        type: integer
                        format: int64
                        example: 7158
                      average:
                        type: integer
                        format: int64
                        example: 8078
                      format:
                        type: string
                        example: Average of 5
                      solves:
                        type: array
                        items:
                          type: integer
                          format: int64
                          example:
                            - 7158
                            - 9055
                            - 7710
                            - 8768
                            - 7757
    Rank:
      type: object
      properties:
        rankType:
          type: string
          example: single
          enum:
            - single
            - average
        personId:
          type: string
          example: 2005AUST01
        eventId:
          type: string
          example: '333'
        best:
          type: integer
          format: int64
          example: 7158
        rank:
          type: object
          properties:
            world:
              type: integer
              format: int64
              example: 179062
            continent:
              type: integer
              format: int64
              example: 46433
            country:
              type: integer
              format: int64
              example: 35643
    Result:
      type: object
      properties:
        competitionId:
          type: string
          example: BrizZonSylwesterOpen2023
        personId:
          type: string
          example: 2005AUST01
        round:
          type: string
          example: First round
        position:
          type: integer
          format: int64
          example: 26
        best:
          type: integer
          format: int64
          example: 7158
        average:
          type: integer
          format: int64
          example: 8078
        format:
          type: string
          example: Average of 5
        solves:
          type: array
          items:
            type: integer
            format: int64
            example:
              - 7158
              - 9055
              - 7710
              - 8768
              - 7757
    Competitions:
      allOf:
        - $ref: '#/components/schemas/Overview'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Competition'
    Persons:
      allOf:
        - $ref: '#/components/schemas/Overview'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Person'
    Ranks:
      allOf:
        - $ref: '#/components/schemas/Overview'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Rank'
    Results:
      allOf:
        - $ref: '#/components/schemas/Overview'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Result'
    Overview:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page:
              type: integer
              format: int64
              example: 1
            size:
              type: integer
              format: int64
              example: 1000
        total:
          type: integer
          format: int64
          example: 10
